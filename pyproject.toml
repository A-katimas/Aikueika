[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "RAG"
version = "0.1.0"
description = "i don't know what i do"
readme = "README.md"
requires-python = ">=3.12 ,<3.14"
dependencies = [
	"flake8>=7.3.0",
	"mypy>=1.20.0",
	"pydantic",
	"torch==2.5.1+cpu",
	"numpy",
	"regex",
	"rank-bm25>=0.2.2",
	"transformers==4.57.1",
	"accelerate>=1.15.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools.packages.find]
include = ["pars*"]
exclude = ["Rag_subject*"]

# ─────────────────────────────────────────────
#  MYPY — vérification de types statique
# ─────────────────────────────────────────────
[tool.mypy]
exclude = ["Rag_subject/"]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "Rag_subject/"
ignore_errors = true

[[tool.mypy.overrides]]
module = "Rag_subject/"
ignore_errors = true

[tool.black]
line-length = 79

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
